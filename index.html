<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efikcoin Merchant System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-500 tracking-wider">EFIKCOIN <span class="text-xs bg-amber-600 text-white px-2 py-0.5 rounded">PAY</span></h1>
            <button id="connectBtn" onclick="connectWallet()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-bold px-4 py-2 rounded-xl transition shadow">
                Connect Wallet
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-5">

        <!-- Status & Wallet Card -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-md">
            <div class="flex justify-between items-center mb-1">
                <span class="text-xs text-slate-400">Account:</span>
                <span id="walletAddress" class="text-xs font-mono text-amber-400">Not Connected</span>
            </div>
            <div class="flex justify-between items-center pt-2 border-t border-slate-700/50">
                <span class="text-xs text-slate-400">EFC Balance:</span>
                <span id="efcBalance" class="text-base font-bold text-emerald-400">0.00 EFC</span>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="grid grid-cols-2 gap-2 bg-slate-800 p-1 rounded-xl border border-slate-700">
            <button onclick="switchTab('bills')" id="tab-bills" class="py-2.5 text-xs font-bold rounded-lg bg-amber-500 text-slate-950 transition">
                📱 Utilities & Bills
            </button>
            <button onclick="switchTab('transfer')" id="tab-transfer" class="py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition">
                🏛️ Bank Payout
            </button>
        </div>

        <!-- TAB 1: RECHARGE & BILLS -->
        <section id="sec-bills" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-4">
            <h2 class="text-base font-bold text-amber-500">Pay Utilities with EFC</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400">Service Category</label>
                    <select id="billService" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                        <option value="airtime">Airtime Recharge</option>
                        <option value="data">Data Bundle</option>
                        <option value="electricity">Electricity Token</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-slate-400">Network / Provider</label>
                    <select id="billProvider" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                        <option value="mtn">MTN</option>
                        <option value="airtel">Airtel</option>
                        <option value="glo">Glo</option>
                        <option value="9mobile">9mobile</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-slate-400">Phone or Meter Number</label>
                    <input type="text" id="billTarget" placeholder="08012345678" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400">Amount (Fiat / NGN)</label>
                    <input type="number" id="billAmount" placeholder="1000" oninput="updateEfcEstimate('bill')" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                    <p id="billEfcCalc" class="text-[11px] text-amber-400/80 mt-1 hidden">Estimated Cost: <span id="billEfcVal">0</span> EFC</p>
                </div>

                <button id="payBillBtn" onclick="processUtilityPayment()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg mt-2">
                    Confirm & Pay with EFC
                </button>
            </div>
        </section>

        <!-- TAB 2: BANK TRANSFER -->
        <section id="sec-transfer" class="bg-slate-800 p-5 rounded-2xl border border-slate-700 shadow-lg space-y-4 hidden">
            <h2 class="text-base font-bold text-emerald-400">Withdraw EFC to Bank Account</h2>
            
            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400">Destination Bank</label>
                    <select id="bankCode" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="058">GTBank</option>
                        <option value="011">First Bank</option>
                        <option value="057">Zenith Bank</option>
                        <option value="033">UBA</option>
                        <option value="999992">OPay</option>
                        <option value="999991">PalmPay</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-slate-400">10-Digit Account Number</label>
                    <input type="text" id="accountNumber" maxlength="10" placeholder="0123456789" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-xs text-slate-400">Payout Amount (Fiat / NGN)</label>
                    <input type="number" id="payoutAmount" placeholder="5000" oninput="updateEfcEstimate('payout')" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500">
                    <p id="payoutEfcCalc" class="text-[11px] text-emerald-400/80 mt-1 hidden">Estimated Cost: <span id="payoutEfcVal">0</span> EFC</p>
                </div>

                <button id="payoutBtn" onclick="processBankWithdrawal()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg mt-2">
                    Execute Bank Transfer
                </button>
            </div>
        </section>

        <!-- Dynamic Status Logger -->
        <div id="statusBox" class="hidden p-4 rounded-xl text-xs font-mono border"></div>

    </main>

    <script>
        // LIVE BACKEND CONFIGURATION
        const BACKEND_API = "https://efikcoin-efc-2.onrender.com/api/merchant";
        const BSC_CHAIN_ID = "0x38"; // 56 in Hex
        const EFC_CONTRACT = "0x677ce9cba67f7484ea951a12897ce780cfd8fed1";
        const TREASURY_ADDRESS = "0x9F8C29E496ECB6C39c221458f211234DfCB233E0";

        // TOKEN EXCHANGE RATE: How many NGN is 1 EFC worth?
        // E.g., If 1 EFC = 10,000 NGN, then 100 NGN airtime costs 0.01 EFC.
        const NGN_PER_EFC = 10000; 

        const ERC20_ABI = [
            "function balanceOf(address owner) view returns (uint256)",
            "function transfer(address to, uint256 amount) returns (bool)"
        ];

        let provider, signer, efcContract, userAddress, userRawBalance = 0;

        function switchTab(tab) {
            ['bills', 'transfer'].forEach(t => {
                document.getElementById(`sec-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "py-2.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition";
            });
            document.getElementById(`sec-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = `py-2.5 text-xs font-bold rounded-lg ${tab === 'bills' ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500 text-slate-950'} transition`;
        }

        function updateEfcEstimate(type) {
            const amountInput = document.getElementById(type === 'bill' ? 'billAmount' : 'payoutAmount').value;
            const calcBox = document.getElementById(type === 'bill' ? 'billEfcCalc' : 'payoutEfcCalc');
            const valSpan = document.getElementById(type === 'bill' ? 'billEfcVal' : 'payoutEfcVal');

            if (amountInput && parseFloat(amountInput) > 0) {
                const calculatedEFC = (parseFloat(amountInput) / NGN_PER_EFC).toFixed(4);
                valSpan.innerText = calculatedEFC;
                calcBox.classList.remove('hidden');
            } else {
                calcBox.classList.add('hidden');
            }
        }

        async function connectWallet() {
            if (!window.ethereum) return alert("Please open inside Trust Wallet or MetaMask browser.");

            try {
                // Auto Switch to BNB Smart Chain
                try {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: BSC_CHAIN_ID }],
                    });
                } catch (switchError) {
                    if (switchError.code === 4902) {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: BSC_CHAIN_ID,
                                chainName: 'BNB Smart Chain',
                                nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                rpcUrls: ['https://bsc-dataseed.binance.org/'],
                                blockExplorerUrls: ['https://bscscan.com/']
                            }],
                        });
                    }
                }

                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();

                efcContract = new ethers.Contract(EFC_CONTRACT, ERC20_ABI, signer);

                // Fetch real live balance on BSC
                const balanceWei = await efcContract.balanceOf(userAddress);
                const balanceEFC = ethers.formatUnits(balanceWei, 18);
                userRawBalance = parseFloat(balanceEFC);

                document.getElementById('walletAddress').innerText = `${userAddress.substring(0, 6)}...${userAddress.substring(userAddress.length - 4)}`;
                document.getElementById('efcBalance').innerText = `${userRawBalance.toFixed(4)} EFC`;
                document.getElementById('connectBtn').innerText = "Connected";

                showStatus("Connected to BSC & EFC Token Contract!", "success");

            } catch (err) {
                showStatus("Wallet Connection Error: " + err.message, "error");
            }
        }

        async function processUtilityPayment() {
            const btn = document.getElementById('payBillBtn');
            const target = document.getElementById('billTarget').value;
            const amountFiat = parseFloat(document.getElementById('billAmount').value);
            const providerName = document.getElementById('billProvider').value;
            const service = document.getElementById('billService').value;

            if (!target || !amountFiat || amountFiat <= 0) return alert("Please enter recipient number and amount.");
            if (!efcContract) return alert("Please connect your wallet first.");

            const requiredEFC = amountFiat / NGN_PER_EFC;

            // UNDERFLOW GUARD: Prevent transaction if user lacks tokens
            if (userRawBalance < requiredEFC) {
                showStatus(`Insufficient EFC Balance! Required: ${requiredEFC.toFixed(4)} EFC, Your Balance: ${userRawBalance.toFixed(4)} EFC.`, "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                showStatus(`Step 1/2: Please confirm transfer of ${requiredEFC.toFixed(4)} EFC in wallet...`, "info");

                const parsedAmount = ethers.parseUnits(requiredEFC.toString(), 18);
                const tx = await efcContract.transfer(TREASURY_ADDRESS, parsedAmount);

                showStatus("Step 2/2: Transaction sent! Awaiting BSC block settlement...", "info");
                const receipt = await tx.wait();

                showStatus("EFC Settlement Confirmed! Contacting Render Backend API...", "info");

                // Call Render Backend
                const res = await fetch(`${BACKEND_API}/pay-bill`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        txHash: receipt.hash,
                        serviceID: providerName,
                        phone: target,
                        amountFiat: amountFiat
                    })
                });

                const data = await res.json();
                if (data.success) {
                    showStatus("SUCCESS: " + data.message, "success");
                } else {
                    showStatus("Backend Delivery Error: " + data.message, "error");
                }

            } catch (err) {
                showStatus("Transaction Stopped: " + (err.reason || err.message), "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Confirm & Pay with EFC";
            }
        }

        async function processBankWithdrawal() {
            const btn = document.getElementById('payoutBtn');
            const bank = document.getElementById('bankCode').value;
            const account = document.getElementById('accountNumber').value;
            const amountFiat = parseFloat(document.getElementById('payoutAmount').value);

            if (!account || account.length !== 10 || !amountFiat || amountFiat <= 0) return alert("Please enter valid account details and amount.");
            if (!efcContract) return alert("Please connect your wallet first.");

            const requiredEFC = amountFiat / NGN_PER_EFC;

            // UNDERFLOW GUARD
            if (userRawBalance < requiredEFC) {
                showStatus(`Insufficient EFC Balance! Required: ${requiredEFC.toFixed(4)} EFC, Your Balance: ${userRawBalance.toFixed(4)} EFC.`, "error");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processing Withdrawal...";

            try {
                showStatus(`Step 1/2: Confirm transfer of ${requiredEFC.toFixed(4)} EFC in wallet...`, "info");

                const parsedAmount = ethers.parseUnits(requiredEFC.toString(), 18);
                const tx = await efcContract.transfer(TREASURY_ADDRESS, parsedAmount);

                showStatus("Step 2/2: Waiting for BSC block settlement...", "info");
                const receipt = await tx.wait();

                showStatus("EFC Settlement Confirmed! Triggering bank payout via Render Backend API...", "info");

                // Call Render Backend
                const res = await fetch(`${BACKEND_API}/withdraw-to-bank`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        txHash: receipt.hash,
                        bankCode: bank,
                        accountNumber: account,
                        amountFiat: amountFiat
                    })
                });

                const data = await res.json();
                if (data.success) {
                    showStatus("SUCCESS: " + data.message, "success");
                } else {
                    showStatus("Bank Payout Error: " + data.message, "error");
                }

            } catch (err) {
                showStatus("Payout Stopped: " + (err.reason || err.message), "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Execute Bank Transfer";
            }
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.classList.remove('hidden', 'bg-emerald-900/50', 'border-emerald-500', 'text-emerald-200', 'bg-rose-900/50', 'border-rose-500', 'text-rose-200', 'bg-blue-900/50', 'border-blue-500', 'text-blue-200');
            box.innerText = msg;

            if (type === 'success') box.classList.add('bg-emerald-900/50', 'border-emerald-500', 'text-emerald-200');
            else if (type === 'error') box.classList.add('bg-rose-900/50', 'border-rose-500', 'text-rose-200');
            else box.classList.add('bg-blue-900/50', 'border-blue-500', 'text-blue-200');
        }
    </script>
</body>
</html>
