<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EFC Pay - Global Merchant Hub</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f59e0b">
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        :root {
            --bg-main: #0a0e17; --card-bg: #141c2e; --accent: #f59e0b;
            --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --success: #10b981; --danger: #ef4444; --border: #1e293b;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-primary); margin: 0; padding: 12px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; }
        .top-nav { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--card-bg); border-radius: 14px; border: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand img { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--accent); }
        .brand-title { font-size: 18px; font-weight: 800; color: var(--text-primary); }
        .card { background: var(--card-bg); padding: 18px; border-radius: 16px; border: 1px solid var(--border); }
        .form-control { width: 100%; padding: 12px; background: #0a0e17; border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; margin-top: 6px; }
        .btn-action { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 10px; color: #000; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .asset-box { background: #0a0e17; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .tab-bar { display: flex; background: var(--card-bg); padding: 4px; border-radius: 12px; gap: 4px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 700; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: #000; }
    </style>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

</head>
<body>

<div class="app-container">
    
    <!-- Top Nav -->
    <div class="top-nav">
        <div class="brand">
            <img src="https://ipfs.io/ipfs/bafybeihrzyodihyp5met2hs32ppj37qlowuxarvs2lnlrgujgrlwxc7fwe" alt="EFC Logo">
            <div class="brand-title">EFC PAY</div>
        </div>
        <button id="pwaInstallBtn" style="display:none;" class="tab-btn active" onclick="installPWA()">📲 Install App</button>
    </div>

    <!-- 1. PIN LOGIN SCREEN (FOR RETURNING USERS) -->
    <div id="pinScreen" class="card" style="display:none; text-align:center;">
        <img src="https://ipfs.io/ipfs/bafybeihrzyodihyp5met2hs32ppj37qlowuxarvs2lnlrgujgrlwxc7fwe" style="width:64px; height:64px; border-radius:50%; margin-bottom:10px;">
        <h2>Welcome Back</h2>
        <p style="font-size:12px; color:var(--text-secondary);">Enter your 4-Digit Security PIN to unlock your wallet:</p>
        <input type="password" id="inputPin" maxlength="4" class="form-control" style="text-align:center; font-size:24px; letter-spacing:10px;" placeholder="••••">
        <button class="btn-action" onclick="verifyPin()">Unlock EFC Wallet</button>
    </div>

    <!-- 2. SETUP SCREEN (NEW USERS) -->
    <div id="setupScreen" class="card" style="display:none; text-align:center;">
        <h2>Create / Import EFC Wallet</h2>
        <p style="font-size:13px; color:var(--text-secondary);">Set up your self-custodial account on BNB Smart Chain.</p>
        <input type="password" id="newPin" maxlength="4" class="form-control" style="text-align:center; margin-bottom:10px;" placeholder="Create 4-Digit PIN">
        <button class="btn-action" onclick="createAccount()">✨ Create New Wallet</button>
        <hr style="border: 0.5px solid var(--border); margin: 15px 0;">
        <textarea id="importKey" class="form-control" rows="2" placeholder="Paste Private Key or Seed Phrase"></textarea>
        <button class="btn-action btn-outline" onclick="importAccount()">🔑 Import Account</button>
    </div>

    <!-- 3. MAIN DASHBOARD -->
    <div id="dashboard" style="display:none;">
        <div class="card" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
            <div style="font-size:11px; color:var(--text-secondary);">WALLET ADDRESS</div>
            <div id="userAddr" style="font-size:12px; font-weight:700; word-break:break-all; margin:4px 0 10px 0;">0x00...</div>
            
            <div style="font-size:11px; color:var(--text-secondary);">EFC BALANCE</div>
            <div id="balEFC" style="font-size:26px; font-weight:800; color:var(--accent);">0.00 EFC</div>

            <div class="asset-grid">
                <div class="asset-box">
                    <div style="font-size:11px; color:var(--text-secondary);">USDT</div>
                    <div id="balUSDT" style="font-weight:700;">0.00</div>
                </div>
                <div class="asset-box">
                    <div style="font-size:11px; color:var(--text-secondary);">USDC</div>
                    <div id="balUSDC" style="font-weight:700;">0.00</div>
                </div>
                <div class="asset-box" style="grid-column: span 2;">
                    <div style="font-size:11px; color:var(--text-secondary);">BNB Gas</div>
                    <div id="balBNB" style="font-weight:700;">0.0000 BNB</div>
                </div>
            </div>
            <button class="btn-action btn-outline" style="margin-top:10px; padding:8px; font-size:12px;" onclick="loadBalances()">🔄 Refresh Balances</button>
        </div>

        <div class="tab-bar" style="margin-top:12px;">
            <button class="tab-btn active" onclick="switchTab('pay')">Utilities</button>
            <button class="tab-btn" onclick="switchTab('bank')">Bank Payout</button>
            <button class="tab-btn" onclick="switchTab('account')">Account</button>
        </div>

        <!-- PAY TAB -->
        <div id="payTab" class="card" style="margin-top:12px;">
            <h3>Pay Utility / Bill</h3>
            <select id="payCoin" class="form-control"><option value="EFC">EFC Token</option><option value="USDT">USDT</option></select>
            <input type="text" id="payPhone" class="form-control" placeholder="Phone / Account Number">
            <input type="number" id="payAmount" class="form-control" placeholder="Amount (NGN)">
            <button class="btn-action" onclick="alert('Transaction processing...')">Pay Bill</button>
        </div>

        <!-- BANK TAB -->
        <div id="bankTab" class="card" style="margin-top:12px; display:none;">
            <h3>Bank Payout</h3>
            <input type="text" class="form-control" placeholder="Bank Code (e.g. 058)">
            <input type="text" class="form-control" placeholder="Account Number">
            <input type="number" class="form-control" placeholder="Amount (NGN)">
            <button class="btn-action" onclick="alert('Bank transfer requested!')">Send Funds</button>
        </div>

        <!-- ACCOUNT TAB -->
        <div id="accountTab" class="card" style="margin-top:12px; display:none;">
            <h3>Account Settings</h3>
            <button class="btn-action btn-outline" onclick="alert('Your Private Key:\n' + activeKey)">View Private Key</button>
            <button class="btn-action" style="background:var(--danger); color:white;" onclick="logout()">Lock App</button>
        </div>
    </div>

</div>

<script>
const RPC_ENDPOINTS = [
    "https://bsc-dataseed.binance.org/",
    "https://bsc-dataseed1.defibit.io/",
    "https://rpc.ankr.com/bsc"
    "https://bsc-dataseed.bnbchain.org"
];
const EFC_CONTRACT = "0x677c7F01373516A7955FAD8A771e84C1C526fed1";
const USDT_CONTRACT = "0x55d398326f99059fF775485246999027B3197955";
const USDC_CONTRACT = "0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d";

let activeKey = "", userWallet = null, provider = null, deferredPrompt = null;

// Register PWA Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration error:', err));
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('pwaInstallBtn').style.display = 'block';
});

function installPWA() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
    }
}

async function init() {
    provider = new ethers.providers.JsonRpcProvider(RPC_ENDPOINTS[0]);
    const storedKey = localStorage.getItem("efc_encrypted_key");
    if (storedKey) {
        document.getElementById("pinScreen").style.display = "block";
    } else {
        document.getElementById("setupScreen").style.display = "block";
    }
}

function verifyPin() {
    const pin = document.getElementById("inputPin").value;
    const storedPin = localStorage.getItem("efc_pin");
    if (pin === storedPin) {
        activeKey = localStorage.getItem("efc_encrypted_key");
        userWallet = new ethers.Wallet(activeKey, provider);
        showDashboard();
    } else {
        alert("Incorrect Security PIN!");
    }
}

function createAccount() {
    const pin = document.getElementById("newPin").value;
    if (pin.length !== 4) return alert("Please set a 4-Digit PIN!");
    
    const w = ethers.Wallet.createRandom();
    localStorage.setItem("efc_pin", pin);
    localStorage.setItem("efc_encrypted_key", w.privateKey);
    activeKey = w.privateKey;
    userWallet = w.connect(provider);
    showDashboard();
}

function importAccount() {
    const pin = document.getElementById("newPin").value;
    const key = document.getElementById("importKey").value.trim();
    if (pin.length !== 4 || !key) return alert("Enter 4-Digit PIN & valid Private Key!");

    try {
        let w = key.includes(" ") ? ethers.Wallet.fromMnemonic(key) : new ethers.Wallet(key.startsWith("0x") ? key : "0x" + key);
        localStorage.setItem("efc_pin", pin);
        localStorage.setItem("efc_encrypted_key", w.privateKey);
        activeKey = w.privateKey;
        userWallet = w.connect(provider);
        showDashboard();
    } catch(e) {
        alert("Invalid Key/Phrase!");
    }
}

function showDashboard() {
    document.getElementById("pinScreen").style.display = "none";
    document.getElementById("setupScreen").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    document.getElementById("userAddr").innerText = userWallet.address;
    loadBalances();
}

async function loadBalances() {
    document.getElementById("balEFC").innerText = "Loading...";
    
    // Direct Multi-RPC Query for EFC Balance
    const abi = ["function balanceOf(address) view returns (uint256)"];
    
    for (let rpc of RPC_ENDPOINTS) {
        try {
            let tempProvider = new ethers.providers.JsonRpcProvider(rpc);
            let contract = new ethers.Contract(EFC_CONTRACT, abi, tempProvider);
            let rawBal = await contract.balanceOf(userWallet.address);
            let formatted = parseFloat(ethers.utils.formatUnits(rawBal, 18)).toFixed(2);
            document.getElementById("balEFC").innerText = formatted + " EFC";
            
            let bnbWei = await tempProvider.getBalance(userWallet.address);
            document.getElementById("balBNB").innerText = parseFloat(ethers.utils.formatEther(bnbWei)).toFixed(4) + " BNB";
            break;
        } catch(e) {
            console.warn("RPC Hop:", rpc);
        }
    }
}

function switchTab(t) {
    document.getElementById("payTab").style.display = t === 'pay' ? 'block' : 'none';
    document.getElementById("bankTab").style.display = t === 'bank' ? 'block' : 'none';
    document.getElementById("accountTab").style.display = t === 'account' ? 'block' : 'none';
}

function logout() {
    location.reload();
}

window.onload = init;
</script>
</body>
