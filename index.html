<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EFC Pay - Mobile POS Terminal</title>

    <!-- Web3 & QR Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg: #090c10;
            --surface: #121721;
            --primary: #f0a500;
            --primary-dark: #c48700;
            --text-main: #ffffff;
            --text-sub: #8b949e;
            --border: #21262d;
            --success: #238636;
            --danger: #da3633;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; height: 100vh; overflow: hidden; }

        .app-frame { width: 100%; max-width: 440px; height: 100vh; background: var(--surface); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

        /* Top Header Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .brand-title { font-size: 1.1rem; font-weight: bold; color: var(--primary); display: flex; align-items: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }

        /* Persistent Balance Card */
        .vault-card { background: #090c10; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin: 12px 0; text-align: center; }
        .vault-label { font-size: 0.72rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; }
        .vault-amount { font-size: 1.8rem; font-weight: bold; color: var(--primary); margin: 4px 0; }
        .vault-sub { font-size: 0.8rem; color: var(--text-sub); display: flex; justify-content: center; gap: 15px; }

        /* Charge Input Screen */
        .charge-display { background: #000; border: 2px solid var(--primary); border-radius: 12px; padding: 15px; text-align: center; margin-bottom: 10px; }
        .charge-title { font-size: 0.75rem; color: var(--text-sub); }
        .charge-value { font-size: 2.2rem; font-weight: bold; color: #fff; margin-top: 2px; }

        /* Hardware Keypad */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .key-btn { background: #1a202c; border: 1px solid var(--border); color: #fff; font-size: 1.4rem; font-weight: bold; padding: 16px 0; border-radius: 10px; cursor: pointer; text-align: center; }
        .key-btn:active { background: var(--primary); color: #000; }
        .key-btn.action-btn { background: #2d3748; font-size: 1rem; }

        /* Bottom Action Navigation */
        .nav-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
        .nav-item { background: #1a202c; border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 0.7rem; color: var(--text-sub); cursor: pointer; }
        .nav-item.active { border-color: var(--primary); color: var(--primary); font-weight: bold; }

        /* Modal Overlays */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-card { width: 90%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; text-align: center; }
        #qrcode { display: flex; justify-content: center; margin: 15px 0; background: #fff; padding: 10px; border-radius: 8px; }

        .btn-confirm { width: 100%; padding: 14px; background: var(--primary); color: #000; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .btn-close { width: 100%; padding: 10px; background: transparent; color: var(--text-sub); border: none; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-frame">
    <!-- TOP HEADER -->
    <div class="top-bar">
        <div class="brand-title">
            <span class="status-dot"></span>
            EFC POS TERMINAL
        </div>
        <div style="font-size:0.75rem; color:var(--text-sub);" id="posIdDisplay">ID: EFC-8921</div>
    </div>

    <!-- VAULT BALANCE DISPLAY -->
    <div class="vault-card">
        <div class="vault-label">Available Terminal Liquidity</div>
        <div class="vault-amount" id="fiatVaultVal">₦0.00</div>
        <div class="vault-sub">
            <span id="efcVaultVal">0.00 EFC</span>
            <span>|</span>
            <span id="bankAccVal">Acc: Loading...</span>
        </div>
    </div>

    <!-- POS CHARGE DISPLAY -->
    <div class="charge-display">
        <div class="charge-title">ENTER CHARGE AMOUNT (NGN)</div>
        <div class="charge-value">₦<span id="chargeAmount">0</span></div>
    </div>

    <!-- NATIVE HARDWARE KEYPAD -->
    <div class="keypad">
        <div class="key-btn" onclick="pressKey('1')">1</div>
        <div class="key-btn" onclick="pressKey('2')">2</div>
        <div class="key-btn" onclick="pressKey('3')">3</div>
        <div class="key-btn" onclick="pressKey('4')">4</div>
        <div class="key-btn" onclick="pressKey('5')">5</div>
        <div class="key-btn" onclick="pressKey('6')">6</div>
        <div class="key-btn" onclick="pressKey('7')">7</div>
        <div class="key-btn" onclick="pressKey('8')">8</div>
        <div class="key-btn" onclick="pressKey('9')">9</div>
        <div class="key-btn action-btn" style="color:var(--danger);" onclick="clearKeypad()">C</div>
        <div class="key-btn" onclick="pressKey('0')">0</div>
        <div class="key-btn action-btn" style="color:var(--primary);" onclick="deleteKey()">⌫</div>
    </div>

    <button class="btn-confirm" onclick="triggerPosCharge()">CHARGE TERMINAL 💳</button>

    <!-- NAVIGATION BAR -->
    <div class="nav-grid">
        <div class="nav-item active" onclick="switchMode('pos')">📱 POS</div>
        <div class="nav-item" onclick="switchMode('airtime')">📞 Airtime</div>
        <div class="nav-item" onclick="switchMode('swap')">🔀 Swap</div>
        <div class="nav-item" onclick="syncTerminalData()">🔄 Sync</div>
    </div>
</div>

<!-- QR PAYMENT MODAL -->
<div class="modal-overlay" id="qrModal">
    <div class="modal-card">
        <h3 style="margin-top:0; color:var(--primary);">Scan POS Code</h3>
        <p style="font-size:0.8rem; color:var(--text-sub);">Customer scans code below using EFC Wallet</p>
        <div id="qrcode"></div>
        <div style="font-size:1.2rem; font-weight:bold; margin-bottom:12px;">₦<span id="modalAmount">0</span></div>
        <button class="btn-confirm" onclick="confirmPaymentSuccess()">Simulate Card/App Tap ✅</button>
        <button class="btn-close" onclick="closeModal()">Cancel Charge</button>
    </div>
</div>

<script>
    const BACKEND_URL = window.location.origin;
    const BSC_RPC = "https://bsc-dataseed.binance.org/";
    const EFC_CONTRACT = "0x677Ce9CBa67f7484ea951a12897CE780cFd8fED1";
    const EFC_ABI = ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)"];

    let currentInput = "0";
    let userProfile = null;
    let userWalletAddress = "";
    let provider;

    async function init() {
        provider = new ethers.providers.JsonRpcProvider(BSC_RPC);

        let key = localStorage.getItem("EFC_PRIVATE_KEY");
        if (!key) {
            const w = ethers.Wallet.createRandom();
            localStorage.setItem("EFC_PRIVATE_KEY", w.privateKey);
            userWalletAddress = w.address;
        } else {
            userWalletAddress = new ethers.Wallet(key).address;
        }

        const saved = localStorage.getItem("EFC_USER_PROFILE");
        if (saved) {
            userProfile = JSON.parse(saved);
            updateUI();
        } else {
            autoRegisterPOS();
        }
    }

    async function autoRegisterPOS() {
        const payload = {
            firstname: "Merchant",
            lastname: "Terminal",
            email: "pos-" + Date.now() + "@efikcoin.xyz",
            phonenumber: "09000000000"
        };

        try {
            const res = await fetch(`${BACKEND_URL}/api/merchant/register-client`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.success) {
                userProfile = {
                    email: payload.email,
                    bankName: data.bank_name,
                    accountNumber: data.account_number,
                    fiatBalance: 0
                };
                localStorage.setItem("EFC_USER_PROFILE", JSON.stringify(userProfile));
                updateUI();
            }
        } catch (e) { console.error("Registration error:", e); }
    }

    function updateUI() {
        if (!userProfile) return;
        document.getElementById("bankAccVal").innerText = `${userProfile.bankName}: ${userProfile.accountNumber}`;
        document.getElementById("fiatVaultVal").innerText = "₦" + (userProfile.fiatBalance || 0).toLocaleString();
        syncTerminalData();
    }

    async function syncTerminalData() {
        if (!userProfile) return;

        // Fetch On-Chain EFC
        try {
            const contract = new ethers.Contract(EFC_CONTRACT, EFC_ABI, provider);
            const raw = await contract.balanceOf(userWalletAddress);
            const dec = await contract.decimals();
            document.getElementById("efcVaultVal").innerText = parseFloat(ethers.utils.formatUnits(raw, dec)).toLocaleString() + " EFC";
        } catch (e) { console.error("EFC Sync error:", e); }

        // Fetch Fiat Balance from Server
        try {
            const res = await fetch(`${BACKEND_URL}/api/merchant/fiat-balance?email=${encodeURIComponent(userProfile.email)}`);
            const data = await res.json();
            if (data.success) {
                userProfile.fiatBalance = data.balance;
                localStorage.setItem("EFC_USER_PROFILE", JSON.stringify(userProfile));
                document.getElementById("fiatVaultVal").innerText = "₦" + data.balance.toLocaleString();
            }
        } catch (e) { console.error("Fiat Sync error:", e); }
    }

    // Keypad Functions
    function pressKey(num) {
        if (currentInput === "0") currentInput = num;
        else if (currentInput.length < 7) currentInput += num;
        document.getElementById("chargeAmount").innerText = parseInt(currentInput).toLocaleString();
    }

    function clearKeypad() {
        currentInput = "0";
        document.getElementById("chargeAmount").innerText = "0";
    }

    function deleteKey() {
        if (currentInput.length > 1) currentInput = currentInput.slice(0, -1);
        else currentInput = "0";
        document.getElementById("chargeAmount").innerText = parseInt(currentInput).toLocaleString();
    }

    // Charge Actions
    function triggerPosCharge() {
        const amt = parseInt(currentInput);
        if (amt <= 0) return alert("Enter valid charge amount!");

        document.getElementById("modalAmount").innerText = amt.toLocaleString();
        
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, { text: `efcpay:${userWalletAddress}?amount=${amt}`, width: 150, height: 150 });

        document.getElementById("qrModal").style.display = "flex";
    }

    function confirmPaymentSuccess() {
        const amt = parseInt(currentInput);
        userProfile.fiatBalance = (userProfile.fiatBalance || 0) + amt;
        localStorage.setItem("EFC_USER_PROFILE", JSON.stringify(userProfile));

        alert(`✅ TRANSACTION SUCCESSFUL!\n\n₦${amt.toLocaleString()} credited to terminal.`);
        closeModal();
        clearKeypad();
        updateUI();
    }

    function closeModal() {
        document.getElementById("qrModal").style.display = "none";
    }

    function switchMode(mode) {
        if (mode === 'airtime') {
            const num = prompt("Enter customer phone number:");
            const amt = prompt("Enter airtime amount (NGN):");
            if (num && amt) alert(`✅ Airtime dispatched to ${num}!`);
        } else if (mode === 'swap') {
            const efc = prompt("Enter EFC amount to exchange:");
            if (efc) {
                const credit = parseFloat(efc) * 100;
                userProfile.fiatBalance = (userProfile.fiatBalance || 0) + credit;
                localStorage.setItem("EFC_USER_PROFILE", JSON.stringify(userProfile));
                alert(`✅ Swapped ${efc} EFC for ₦${credit.toLocaleString()} NGN!`);
                updateUI();
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
