<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFC Pay Global - Peaceful & Secure Merchant Banking</title>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg: #07090e;
            --card: #10141d;
            --gold: #f0a500;
            --green: #00c853;
            --red: #ff3d00;
            --border: #1e2638;
            --text: #e6edf3;
            --text-sub: #8b949e;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; }
        .app { width: 100%; max-width: 480px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

        .header { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .logo { width: 38px; height: 38px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #000; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        .btn-gold { background: var(--gold); color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 8px; width: 100%; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: bold; padding: 10px; border-radius: 8px; width: 100%; cursor: pointer; }

        input, select { width: 100%; padding: 10px; background: #0b0e14; border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-top: 4px; margin-bottom: 10px; }

        .invoice-receipt { background: #fff; color: #000; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 0.8rem; margin-top: 10px; }
        .badge-success { background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-fail { background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app">

    <!-- APP HEADER -->
    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <div class="logo">EFC</div>
            <div>
                <div style="font-weight:900;">EFC PAY GLOBAL</div>
                <div style="font-size:0.65rem; color:var(--text-sub);">Global Blockchain Merchant Platform 🕊️</div>
            </div>
        </div>
        <span style="color:var(--green); font-size:0.7rem; font-weight:bold;">● BSC MAINNET</span>
    </div>

    <!-- MAIN CONTROL TABS -->
    <div class="grid-3">
        <button class="btn-outline" onclick="showTab('dashboard')">Dashboard</button>
        <button class="btn-outline" onclick="showTab('pos')">Live POS</button>
        <button class="btn-outline" onclick="showTab('invoices')">History</button>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="tab-dashboard" class="card">
        <div style="font-size:0.75rem; color:var(--text-sub);">EFC Vault Balance</div>
        <div style="font-size:1.8rem; font-weight:bold; color:var(--gold);" id="valEfc">0.00 EFC</div>
        <div style="font-size:0.75rem; color:var(--text-sub); margin-bottom:12px;" id="valAddress">0x...</div>

        <div class="grid-2">
            <button class="btn-gold" onclick="openTransferModal('send')">Send / Transfer</button>
            <button class="btn-outline" onclick="openTransferModal('receive')">Receive EFC</button>
        </div>
    </div>

    <!-- LIVE POS TERMINAL VIEW -->
    <div id="tab-pos" class="card" style="display:none;">
        <h3 style="margin-top:0; color:var(--gold);">EFCPAY Merchant POS</h3>
        <label>Enter Sale Amount (NGN / USD)</label>
        <input type="number" id="posAmount" placeholder="0.00">
        <label>Customer Payment Type</label>
        <select id="posType">
            <option value="EFC_ONCHAIN">EFC Blockchain Transfer</option>
            <option value="BANK_TRANSFER">Bank Direct Payout</option>
            <option value="CARD_POS">POS Card Terminal</option>
        </select>
        <button class="btn-gold" onclick="generatePOSInvoice()">Generate Live POS Invoice</button>

        <div id="posOutput"></div>
    </div>

    <!-- PROOF HISTORY & INVOICE VIEW -->
    <div id="tab-invoices" class="card" style="display:none;">
        <h3 style="margin-top:0; color:var(--gold);">Proof Invoices & Logs</h3>
        <div id="historyLogs">
            <!-- Dynamic receipts go here -->
        </div>
    </div>

</div>

<script>
    const EFC_CONTRACT = "0x677Ce9CBa67f7484ea951a12897CE780cFd8fED1";
    let wallet;

    function init() {
        let key = localStorage.getItem("EFC_PRIV_KEY");
        if(!key) {
            wallet = ethers.Wallet.createRandom();
            localStorage.setItem("EFC_PRIV_KEY", wallet.privateKey);
        } else {
            wallet = new ethers.Wallet(key);
        }
        document.getElementById("valAddress").innerText = wallet.address;
        renderHistory();
    }

    function showTab(name) {
        document.getElementById("tab-dashboard").style.display = name === 'dashboard' ? 'block' : 'none';
        document.getElementById("tab-pos").style.display = name === 'pos' ? 'block' : 'none';
        document.getElementById("tab-invoices").style.display = name === 'invoices' ? 'block' : 'none';
    }

    function generatePOSInvoice() {
        const amt = document.getElementById("posAmount").value;
        const type = document.getElementById("posType").value;

        if(!amt) return alert("Enter valid amount");

        const txId = "INV-EFC-" + Math.floor(100000 + Math.random() * 900000);
        const status = Math.random() > 0.1 ? "SUCCESS" : "FAILED"; // Simulated execution

        const invoiceHTML = `
            <div class="invoice-receipt">
                <div style="text-align:center;">
                    <h4>EFC PAY GLOBAL RECEIPT</h4>
                    <p>Tx ID: ${txId}</p>
                </div>
                <hr>
                <p><strong>Amount:</strong> ₦${amt}</p>
                <p><strong>Payment Method:</strong> ${type}</p>
                <p><strong>Status:</strong> <span class="${status === 'SUCCESS' ? 'badge-success' : 'badge-fail'}">${status}</span></p>
                <p><strong>Timestamp:</strong> ${new Date().toLocaleString()}</p>
                <hr>
                <p style="text-align:center; font-size:0.65rem;">Verified On EFC Chain & Global Settlement</p>
            </div>
        `;

        document.getElementById("posOutput").innerHTML = invoiceHTML;

        // Save to Proof History
        const logs = JSON.parse(localStorage.getItem("EFC_HISTORY") || "[]");
        logs.unshift({ txId, amt, type, status, time: new Date().toLocaleString() });
        localStorage.setItem("EFC_HISTORY", JSON.stringify(logs));
        renderHistory();
    }

    function renderHistory() {
        const logs = JSON.parse(localStorage.getItem("EFC_HISTORY") || "[]");
        let html = "";
        logs.forEach(log => {
            html += `
                <div style="border-bottom: 1px solid var(--border); padding: 8px 0; font-size: 0.75rem;">
                    <div><strong>${log.txId}</strong> - ₦${log.amt} (${log.type})</div>
                    <div style="display:flex; justify-content:space-between; margin-top:4px;">
                        <span>${log.time}</span>
                        <span style="color:${log.status === 'SUCCESS' ? 'var(--green)' : 'var(--red)'}">${log.status}</span>
                    </div>
                </div>
            `;
        });
        document.getElementById("historyLogs").innerHTML = html || "<p style='font-size:0.8rem;'>No transactions recorded yet.</p>";
    }

    window.onload = init;
</script>
</body>
</html>
